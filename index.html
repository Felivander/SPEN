<!doctype html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what unlocks env(safe-area-inset-*) on iPhone.
         No maximum-scale: pinch zoom must stay available. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Gastos e ingresos, anotados hablando." />

    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spens" />
    <!-- Vite rewrites these against `base`, so they survive the /SPEN/ subpath. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Status bar / browser chrome follows the paper colour in both appearances -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDEBE6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151513" />

    <title>Spens</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
